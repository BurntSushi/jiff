[package]
publish = false
name = "jiff-wasm"
version = "0.1.0"
edition = "2021"

# Examples in Jiff are explicitly isolated from the workspace to avoid
# dev-dependencies accumulating. (Not all examples have big dependency trees,
# but we still exclude them from the workspace as a general rule.)
[workspace]

[lib]
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
jiff = { path = "../../crates/jiff", features = ["js"] }
wasm-bindgen = "0.2.84"
wasm-bindgen-test = "0.3.34"
web-sys = { version = "0.3.69", features = ["console"] }

# The `console_error_panic_hook` crate provides better debugging of panics
# by logging them with `console.error`.
console_error_panic_hook = "0.1.7"
