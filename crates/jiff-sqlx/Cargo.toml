[package]
name = "jiff-sqlx"
version = "0.2.2"  #:version
authors = ["Andrew Gallant <jamslam@gmail.com>"]
license = "Unlicense OR MIT"
homepage = "https://github.com/BurntSushi/jiff/tree/master/crates/jiff-sqlx"
repository = "https://github.com/BurntSushi/jiff"
documentation = "https://docs.rs/jiff-sqlx"
description = "Integration for Jiff with SQLx."
categories = ["date-and-time"]
keywords = ["date", "time", "jiff", "sqlx", "zone"]
include = ["/src/*.rs", "/*.dat", "COPYING", "LICENSE-MIT", "UNLICENSE"]
edition.workspace = true
rust-version = "1.94"

[lib]
name = "jiff_sqlx"
bench = false
path = "src/lib.rs"

[features]
default = []
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]
serde = ["dep:serde", "jiff/serde"]

[dependencies]
# The `std` feature is necessary for the `std::error::Error` impl.
jiff = { version = "0.2.43", path = "../jiff", default-features = false, features = ["std"] }
sqlx = { version = "0.9.0", default-features = false }
serde = { version = "1.0", optional = true, default-features = false }

[dev-dependencies]
jiff = { version = "0.2.43", path = "../jiff", default-features = true }

[lints.cargo]
# We squash this warning because Cargo falsely reports that the `sqlx`
# dependency is unused. While this is true in the default feature
# configuration, it is still used when one of `postgres` or `sqlite` are
# enabled.
unused_dependencies = "allow"
