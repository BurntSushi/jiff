name: Publish to crates.io
on:
  push:
    tags: ['*']
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: rust-lang/crates-io-auth-action@v1
      id: auth
    - run: |
        cargo publish -p jiff-core || true
        cargo publish -p jiff-static || true
        cargo publish -p jiff-tzdb || true
        cargo publish -p jiff-tzdb-platform || true
        cargo publish -p jiff || true
        cargo publish -p jiff-icu || true
        cargo publish -p jiff-diesel || true
        cargo publish -p jiff-sqlx || true
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
